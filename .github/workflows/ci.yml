name: API Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Check API key is set
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "❌ REQRES_API_KEY is empty — did you add the GitHub Secret?"
            exit 1
          else
            echo "✅ REQRES_API_KEY is set (length: ${#REQRES_API_KEY})"
          fi
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            test-output.txt
